name: Live API check
# Calls the real public APIs (TCMB, AFAD, Kandilli, Aladhan, Open-Meteo) once a week
# so that upstream format changes are noticed quickly.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
